<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      body {
        margin: 0;
        font:
          14px system-ui,
          sans-serif;
      }
      img {
        max-width: 100%;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- ĐỒNG BỘ FIREBASE: dán thông tin dự án vào 6 dòng bên dưới. Để trống thì trang chỉ lưu trên máy này. -->

        projectId: "phan-thanh-sieu",
        storageBucket: "phan-thanh-sieu.firebasestorage.app",
        messagingSenderId: "1006925917524",
        appId: "1:1006925917524:web:9ae9dcebda715965dbecc1",
      };
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <title>Sổ cắt gác</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"
    />
    <style>
      /* Bố cục: công cụ điều hành. Tab trên cùng, bảng 7 ngày (hàng = ca x vị trí, cột = ngày), ô bấm để xếp người. Màn hẹp chuyển sang xem theo ngày. */
      :root {
        --font:
          "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --bg: #f2f5f7;
        --surface: #ffffff;
        --surface-2: #e9eef2;
        --fg: #13202a;
        --muted: #566676;
        --line: #d3dbe2;
        --line-strong: #b3bfca;
        --accent: #0a6c70;
        --accent-hover: #085a5d;
        --on-accent: #ffffff;
        --accent-soft: #d6eeef;
        --ok: #1b7a4b;
        --ok-soft: #dcf1e5;
        --warn: #955200;
        --warn-soft: #fdebcb;
        --bad: #b3261e;
        --bad-soft: #fbdfdc;
        --s0: #9a5b00;
        --s0-soft: #fdf0d5;
        --s1: #1b5fa8;
        --s1-soft: #dfeafa;
        --s2: #4b3fa0;
        --s2-soft: #e6e3f8;
        --s3: #0a6c70;
        --s3-soft: #d6eeef;
        --shadow: 0 12px 40px rgba(10, 25, 35, 0.22);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1419;
          --surface: #151e25;
          --surface-2: #1d2830;
          --fg: #e6edf2;
          --muted: #93a4b3;
          --line: #27343e;
          --line-strong: #3a4b58;
          --accent: #4fc3c7;
          --accent-hover: #7ad6d9;
          --on-accent: #06262a;
          --accent-soft: #12383b;
          --ok: #5bd28f;
          --ok-soft: #14352a;
          --warn: #f0b04a;
          --warn-soft: #3a2b10;
          --bad: #ff8a80;
          --bad-soft: #40201e;
          --s0: #f0b04a;
          --s0-soft: #33270f;
          --s1: #7db4f2;
          --s1-soft: #15293f;
          --s2: #b3a8ff;
          --s2-soft: #241f48;
          --s3: #4fc3c7;
          --s3-soft: #12383b;
          --shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1419;
        --surface: #151e25;
        --surface-2: #1d2830;
        --fg: #e6edf2;
        --muted: #93a4b3;
        --line: #27343e;
        --line-strong: #3a4b58;
        --accent: #4fc3c7;
        --accent-hover: #7ad6d9;
        --on-accent: #06262a;
        --accent-soft: #12383b;
        --ok: #5bd28f;
        --ok-soft: #14352a;
        --warn: #f0b04a;
        --warn-soft: #3a2b10;
        --bad: #ff8a80;
        --bad-soft: #40201e;
        --s0: #f0b04a;
        --s0-soft: #33270f;
        --s1: #7db4f2;
        --s1-soft: #15293f;
        --s2: #b3a8ff;
        --s2-soft: #241f48;
        --s3: #4fc3c7;
        --s3-soft: #12383b;
        --shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.5;
        padding-block: 0 40px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0 0 auto;
        height: env(safe-area-inset-top, 0px);
        background: var(--bg);
        z-index: 10;
      }
      .in {
        max-width: 1320px;
        margin: 0 auto;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .sh0 {
        --c: var(--s0);
        --cs: var(--s0-soft);
      }
      .sh1 {
        --c: var(--s1);
        --cs: var(--s1-soft);
      }
      .sh2 {
        --c: var(--s2);
        --cs: var(--s2-soft);
      }
      .sh3 {
        --c: var(--s3);
        --cs: var(--s3-soft);
      }
      .tm {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        font-weight: 500;
        font-size: 12px;
      }

      /* Đầu trang */
      .hd {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 8px 24px;
        padding: 18px 0 14px;
      }
      .hd h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      .unit {
        color: var(--muted);
        margin-top: 2px;
      }
      .range {
        text-align: right;
        min-width: 0;
      }
      .range .rl {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .range b {
        font-weight: 600;
      }
      @media (max-width: 620px) {
        .range {
          text-align: left;
        }
      }

      /* Tab */
      .tabs {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 8;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 2px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        background: none;
        border: 0;
        border-bottom: 3px solid transparent;
        padding: 11px 14px;
        cursor: pointer;
        color: var(--muted);
        font-weight: 500;
        white-space: nowrap;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .tab:hover {
        color: var(--fg);
      }
      .tab[aria-selected="true"] {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }
      .tab .bdg {
        background: var(--bad);
        color: var(--surface);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        padding: 0 6px;
        min-width: 18px;
        text-align: center;
        line-height: 18px;
      }
      main {
        padding-top: 16px;
      }

      /* Nút & form */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 38px;
        padding: 7px 14px;
        border-radius: 8px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        cursor: pointer;
        font-weight: 500;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--surface-2);
      }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      .btn.primary:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      .btn.danger {
        color: var(--bad);
      }
      .btn.danger.solid {
        background: var(--bad);
        border-color: var(--bad);
        color: var(--surface);
      }
      .btn.sm {
        min-height: 30px;
        padding: 3px 10px;
        font-size: 13px;
      }
      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface);
      }
      .seg button {
        border: 0;
        background: none;
        padding: 7px 14px;
        min-height: 38px;
        cursor: pointer;
        font-weight: 500;
      }
      .seg button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 600;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 12px;
        min-width: 0;
      }
      .field > label,
      .lbl {
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
      }
      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="number"],
      input[type="date"],
      input[type="time"],
      input[type="search"],
      select,
      textarea {
        width: 100%;
        min-width: 0;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        min-height: 40px;
      }
      textarea {
        resize: vertical;
        min-height: 200px;
        font-size: 13px;
        line-height: 1.55;
      }
      .chk {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 32px;
        cursor: pointer;
      }
      .chk input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      @media (max-width: 600px) {
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        input[type="date"],
        input[type="time"],
        input[type="search"],
        select,
        textarea {
          font-size: 16px;
        }
        .two {
          grid-template-columns: 1fr;
        }
      }

      /* Thanh công cụ */
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .bar .grow {
        flex: 1 1 auto;
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .pill {
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 12px;
        background: var(--surface-2);
        color: var(--muted);
      }
      .pill b {
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
      .pill.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .pill.ok b {
        color: var(--ok);
      }
      .pill.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .pill.warn b {
        color: var(--warn);
      }
      .pill.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .pill.bad b {
        color: var(--bad);
      }
      .note {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        padding: 10px 14px;
        border-radius: 10px;
        background: var(--accent-soft);
        margin-bottom: 12px;
      }
      .note.swap {
        background: var(--warn-soft);
      }
      .note p {
        min-width: 0;
        flex: 1 1 240px;
      }

      /* Bảng 7 ngày */
      .gridwrap {
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
      }
      .grid {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        min-width: 1000px;
        table-layout: fixed;
      }
      .grid th,
      .grid td {
        border-bottom: 1px solid var(--line);
        border-right: 1px solid var(--line);
        padding: 0;
        vertical-align: top;
      }
      .grid tr:last-child td {
        border-bottom: 0;
      }
      .grid th:last-child,
      .grid td:last-child {
        border-right: 0;
      }
      .grid th {
        background: var(--surface-2);
        text-align: left;
        padding: 8px 10px;
        font-weight: 500;
        font-size: 12px;
        color: var(--muted);
      }
      .grid th b {
        color: var(--fg);
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .grid th.we {
        color: var(--bad);
      }
      .grid th.today {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .grid th.today b {
        color: var(--accent);
      }
      .grid th em {
        display: block;
        font-style: normal;
        font-size: 11px;
        font-weight: 600;
      }
      .grid .first {
        position: sticky;
        left: 0;
        z-index: 2;
        width: 140px;
        padding: 8px 10px;
        background: var(--surface);
        border-right: 1px solid var(--line-strong);
      }
      .grid th.first {
        z-index: 3;
        background: var(--surface-2);
      }
      .grid tr.band td {
        background: var(--cs);
        height: 34px;
        padding: 0;
      }
      .grid tr.band td.first {
        background: var(--cs);
        padding: 6px 10px;
        display: table-cell;
      }
      .grid tr.band td.first b {
        color: var(--c);
        margin-right: 4px;
      }
      .grid .pn b {
        display: block;
        font-weight: 600;
        line-height: 1.3;
      }
      .grid .pn .need {
        font-size: 11px;
        color: var(--muted);
      }
      .grid td.we {
        background: color-mix(in srgb, var(--surface-2) 45%, var(--surface));
      }

      /* Ô gác */
      .slot {
        min-height: 54px;
        padding: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-content: flex-start;
        cursor: pointer;
        position: relative;
      }
      .slot:hover {
        background: var(--surface-2);
      }
      .slot.part {
        background: var(--warn-soft);
      }
      .slot.none {
        background: var(--bad-soft);
      }
      .cnt {
        margin-left: auto;
        align-self: flex-end;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        font-weight: 500;
      }
      .slot.part .cnt {
        color: var(--warn);
        font-weight: 700;
      }
      .slot.none .cnt {
        color: var(--bad);
        font-weight: 700;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 2px 9px;
        border-radius: 999px;
        background: var(--cs, var(--surface-2));
        border: 1px solid var(--c, var(--line-strong));
        font-size: 12px;
        line-height: 1.5;
        white-space: nowrap;
        max-width: 100%;
      }
      .chip small {
        color: var(--muted);
        font-size: 11px;
      }
      .chip.bad {
        border-color: var(--bad);
        background: var(--bad-soft);
        color: var(--bad);
        font-weight: 600;
      }
      .chip.bad::before {
        content: "!";
        display: inline-grid;
        place-items: center;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--bad);
        color: var(--surface);
        font-size: 10px;
        font-weight: 700;
      }
      .chip.sw {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .ph {
        padding: 2px 9px;
        border: 1px dashed var(--line-strong);
        border-radius: 999px;
        color: var(--muted);
        font-size: 12px;
      }
      .swapmode .slot {
        cursor: copy;
      }
      .swapmode .chip {
        cursor: pointer;
      }

      /* Xem theo ngày */
      .daybar {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 8px;
        margin-bottom: 8px;
      }
      .dbtn {
        flex: 0 0 auto;
        min-width: 64px;
        padding: 6px 10px;
        border-radius: 10px;
        border: 1px solid var(--line-strong);
        background: var(--surface);
        cursor: pointer;
        text-align: center;
        line-height: 1.3;
      }
      .dbtn span {
        display: block;
        font-size: 12px;
        color: var(--muted);
      }
      .dbtn b {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .dbtn.we span {
        color: var(--bad);
      }
      .dbtn[aria-pressed="true"] {
        background: var(--accent);
        border-color: var(--accent);
      }
      .dbtn[aria-pressed="true"] span,
      .dbtn[aria-pressed="true"] b {
        color: var(--on-accent);
      }
      .dsec {
        margin-bottom: 18px;
      }
      .dsec h3 {
        font-size: 15px;
        font-weight: 700;
        color: var(--c);
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-bottom: 8px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 10px;
      }
      .pcard {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        min-width: 0;
      }
      .pcard .ph-h {
        padding: 8px 12px 0;
        font-weight: 600;
      }
      .pcard .slot {
        min-height: 60px;
        padding: 8px 12px 10px;
      }

      /* Cảnh báo */
      .issues {
        margin-top: 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0;
      }
      .issues summary {
        padding: 12px 14px;
        cursor: pointer;
        font-weight: 600;
      }
      .issues ul {
        list-style: none;
        margin: 0;
        padding: 0 14px 8px;
      }
      .issues li {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .issues li span.tx {
        min-width: 0;
        flex: 1;
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        font-weight: 700;
        border-radius: 6px;
        padding: 1px 7px;
        margin-right: 6px;
        white-space: nowrap;
      }
      .tag.warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .tag.bad {
        background: var(--bad-soft);
        color: var(--bad);
      }
      .tag.ok {
        background: var(--ok-soft);
        color: var(--ok);
      }
      .tag.mut {
        background: var(--surface-2);
        color: var(--muted);
      }
      .allgood {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 10px;
        background: var(--ok-soft);
        color: var(--ok);
        font-weight: 500;
      }
      .empty {
        padding: 28px 16px;
        text-align: center;
        color: var(--muted);
        background: var(--surface);
        border: 1px dashed var(--line-strong);
        border-radius: 10px;
      }

      /* Danh sách chung */
      .sec {
        margin-bottom: 26px;
      }
      .sec > h2 {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .sec > .sub {
        color: var(--muted);
        margin-bottom: 10px;
      }
      .plist {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 10px;
      }
      .pc {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }
      .pc.off {
        opacity: 0.65;
      }
      .pc h3 {
        font-size: 15px;
        font-weight: 600;

          var c = { cs: 0, q: 0 };
          arr.forEach(function (pid) {
            var p = person(pid);
            if (!p) return;
            if (p.type === "qncn") c.q++;
            else c.cs++;
          });
          return c;

        function slotFill(key, po, shId) {
          var n = slotNeeds(po, shId),
            c = slotCounts(getSlot(key));
          return {
            n: n,
            c: c,
            need: n.cs + n.q,
            filled: Math.min(c.cs, n.cs) + Math.min(c.q, n.q),
            mcs: Math.max(0, n.cs - c.cs),
            mq: Math.max(0, n.q - c.q),
          };
        }

          return (

            po.need +

            (po.qn ? " + " + po.qn + " QNCN" : "") +

        function missText(m) {
          return [m.cs ? m.cs + " chiến sĩ" : "", m.q ? m.q + " QNCN" : ""]

        /* Ca đang gác */
        var CUR = [];
        function nowMs() {
          var t = new Date();
          return Date.UTC(
            t.getFullYear(),
            t.getMonth(),
            t.getDate(),
            t.getHours(),
            t.getMinutes(),
            t.getSeconds(),
          );
        }
        function shiftAt(ms) {
          var out = [],
            t = new Date();
          for (var k = -1; k <= 1; k++) {
            var iso = isoOf(
              new Date(t.getFullYear(), t.getMonth(), t.getDate() + k),
            );
            S.shifts.forEach(function (sh) {
              var iv = interval(iso, sh.id);
              if (iv && iv.s <= ms && ms < iv.e)
                out.push({ iso: iso, sh: sh, iv: iv });
            });
          }
          return out;
        }
        function nextShifts(ms) {
          var best = [],
            t = new Date();
          for (var k = 0; k <= 2; k++) {
            var iso = isoOf(
              new Date(t.getFullYear(), t.getMonth(), t.getDate() + k),
            );
            S.shifts.forEach(function (sh) {
              var iv = interval(iso, sh.id);
              if (!iv || iv.s <= ms) return;
              if (!best.length || iv.s < best[0].iv.s)
                best = [{ iso: iso, sh: sh, iv: iv }];
              else if (iv.s === best[0].iv.s)
                best.push({ iso: iso, sh: sh, iv: iv });
            });
          }
          return best;
        }
        function isNow(shId) {
          return CUR.some(function (c) {
            return c.sh.id === shId;
          });

        function fmtMin(m) {
          m = Math.max(0, Math.round(m));

          );

        function analyze() {
          var r = { missing: [], conf: [], confSet: {}, total: 0, filled: 0 };
          dates.forEach(function (d) {
            S.shifts.forEach(function (sh) {
              S.posts.forEach(function (po) {
                var key = mk(d.iso, po.id, sh.id),
                  arr = getSlot(key),
                  f = slotFill(key, po, sh.id);
                r.total += f.need;
                r.filled += f.filled;
                if (f.mcs || f.mq)
                  r.missing.push({
                    key: key,
                    n: f.mcs + f.mq,
                    cs: f.mcs,
                    q: f.mq,
                  });
                arr.forEach(function (pid) {
                  var x = reasons(pid, d.iso, sh.id, key);
                  if (x.length) {
                    r.confSet[key + "|" + pid] = x;
                    r.conf.push({ key: key, pid: pid, r: x });
                  }
                });
              });
            });
          });
          return r;
        }
        function weekCount(pid) {
          var win = {};
          dates.forEach(function (d) {
            win[d.iso] = 1;
          });
          var n = 0;
          Object.keys(S.assign).forEach(function (k) {
            if (win[k.split("|")[0]] && S.assign[k].indexOf(pid) >= 0) n++;
          });
          return n;
        }

        /* ---------- Tự động cắt gác ---------- */
        function autoAssign(mode) {
          var win = {};
          dates.forEach(function (d) {
            win[d.iso] = 1;
          });
          if (mode === "all")
            Object.keys(S.assign).forEach(function (k) {
              if (win[k.split("|")[0]]) delete S.assign[k];
            });
          var act = S.people.filter(function (p) {
            return p.active;
          });
          var cnt = {},
            ngt = {},
            pu = {};
          act.forEach(function (p) {
            cnt[p.id] = 0;
            ngt[p.id] = 0;
          });
          Object.keys(S.assign).forEach(function (k) {
            var p = k.split("|");
            if (!win[p[0]]) return;
            var s = shift(p[2]);
            S.assign[k].forEach(function (pid) {
              if (pid in cnt) {
                cnt[pid]++;
                if (s && s.night) ngt[pid]++;
                pu[pid + p[1]] = (pu[pid + p[1]] || 0) + 1;
              }
            });
          });
          var added = 0;
          dates.forEach(function (d) {
            S.shifts.forEach(function (sh) {
              S.posts.forEach(function (po) {
                var key = mk(d.iso, po.id, sh.id);
                if (!S.assign[key]) S.assign[key] = [];
                var arr = S.assign[key];
                var f = slotFill(key, po, sh.id);
                /* QNCN xếp trước, rồi tới chiến sĩ, cùng một vị trí */
                [
                  [true, f.mq],
                  [false, f.mcs],
                ].forEach(function (x) {
                  var left = x[1];
                  while (left > 0) {
                    var best = null,
                      bs = 1e9;
                    for (var i = 0; i < act.length; i++) {
                      var p = act[i];
                      if ((p.type === "qncn") !== x[0]) continue;
                      if (arr.indexOf(p.id) >= 0) continue;
                      if (reasons(p.id, d.iso, sh.id, key).length) continue;
                      var sc =
                        cnt[p.id] * 10 +
                        (sh.night ? ngt[p.id] * 5 : 0) +
                        (pu[p.id + po.id] || 0) * 1.5 +
                        (S.settings.byOrder ? i * 0.05 : Math.random() * 4);
                      if (sc < bs) {
                        bs = sc;
                        best = p;
                      }
                    }
                    if (!best) break;
                    arr.push(best.id);
                    cnt[best.id]++;
                    if (sh.night) ngt[best.id]++;
                    pu[best.id + po.id] = (pu[best.id + po.id] || 0) + 1;
                    added++;
                    left--;
                  }
                });
              });
            });
          });
          Object.keys(S.assign).forEach(function (k) {
            if (!S.assign[k].length) delete S.assign[k];
          });
          return added;
        }

        /* ---------- Giao diện: thành phần ---------- */
        function chip(pid, key, full) {
          var p = person(pid);
          if (!p) return "";
          var bad = A.confSet[key + "|" + pid],
            sw = ui.swap && ui.swap.key === key && ui.swap.pid === pid;
          return (
            '<span class="chip' +
            (bad ? " bad" : "") +
            (sw ? " sw" : "") +
            '" data-act="chip" data-key="' +
            key +
            '" data-pid="' +
            pid +
            '" title="' +
            esc(p.name + (bad ? " — " + bad.join(", ") : "")) +
            '">' +
            esc(full ? p.name : shortName(p.name)) +
            (full && p.rank ? " <small>" + esc(p.rank) + "</small>" : "") +
            (p.type === "qncn" ? ' <small class="qn">QNCN</small>' : "") +
            "</span>"
          );
        }
        function slotDiv(key, po, full) {
          var shId = key.split("|")[2],
            f = slotFill(key, po, shId),
            arr = getSlot(key);
          var st = f.filled >= f.need ? "ok" : f.filled ? "part" : "none";
          var qs = arr.filter(function (id) {
              var p = person(id);
              return p && p.type === "qncn";
            }),
            cs = arr.filter(function (id) {
              var p = person(id);
              return p && p.type !== "qncn";
            });
          var c = qs
            .concat(cs)
            .map(function (pid) {
              return chip(pid, key, full);
            })
            .join("");
          var i;
          for (i = 0; i < f.mq; i++) c += '<span class="ph q">+ QNCN</span>';
          for (i = 0; i < f.mcs; i++)
            c +=
              '<span class="ph">+ ' + (f.n.q ? "Chiến sĩ" : "Thêm") + "</span>";
          return (
            '<div class="slot ' +
            st +
            '" role="button" tabindex="0" data-act="slot" data-key="' +
            key +
            '" aria-label="' +
            esc(po.name + ", " + f.filled + " trên " + f.need + " người") +
            '">' +
            c +
            '<span class="cnt">' +
            f.filled +
            "/" +
            f.need +
            "</span></div>"
          );
        }

        function issuesPanel() {

          });

              return S.people[i].id === id;
            }),
            np = pos + dir;
          if (np < 0 || np >= idxs.length) return;
          var a = idxs[pos],
            b = idxs[np],
            t = S.people[a];
          S.people[a] = S.people[b];
          S.people[b] = t;
        }

            ti = S.people.indexOf(t);
          S.people.splice(oi, 1);
          var ni = S.people.indexOf(t);
          S.people.splice(oi < ti ? ni + 1 : ni, 0, p);

        function exchangeCheck(ex) {
          if (!ex.p1 || !ex.p2 || !ex.d1 || !ex.d2)
            return { err: "Hãy chọn đủ hai lượt gác" };
          if (ex.p1 === ex.p2) return { err: "Hãy chọn hai người khác nhau" };
          if (ex.d1 === ex.d2)
            return { err: "Hai lượt gác phải ở hai ca khác nhau" };
          var a = getSlot(ex.d1),
            b = getSlot(ex.d2);
          if (b.indexOf(ex.p1) >= 0 || a.indexOf(ex.p2) >= 0)
            return { err: "Một trong hai người đã có mặt ở ca kia" };
          var oa = S.assign[ex.d1],
            ob = S.assign[ex.d2],
            a2 = a.slice(),
            b2 = b.slice();
          a2[a2.indexOf(ex.p1)] = ex.p2;
          b2[b2.indexOf(ex.p2)] = ex.p1;
          S.assign[ex.d1] = a2;
          S.assign[ex.d2] = b2;
          var w = [];
          [
            [ex.p2, ex.d1],
            [ex.p1, ex.d2],
          ].forEach(function (x) {
            var q = x[1].split("|"),
              r = reasons(x[0], q[0], q[2], x[1]);
            if (r.length) w.push({ pid: x[0], r: r });

          if (oa) S.assign[ex.d1] = oa;

        function snapDay(iso) {
          var rows = [];
          S.shifts.forEach(function (sh) {
            S.posts.forEach(function (po) {
              var key = mk(iso, po.id, sh.id),
                f = slotFill(key, po, sh.id);
              var names = getSlot(key)
                .map(function (pid) {
                  var p = person(pid);
                  return p
                    ? { n: p.name, r: p.rank || "", q: p.type === "qncn" }
                    : null;
                })
                .filter(Boolean);
              rows.push({
                sh: sh.name,
                t: sh.start + "–" + sh.end,
                nt: !!sh.night,
                po: po.name,
                need: f.need,
                names: names,
              });
            });
          });
          return { iso: iso, rows: rows };
        }
        function archivePast() {
          var today = dates[0].iso,
            days = {},
            n = 0;
          Object.keys(S.assign).forEach(function (k) {
            var d = k.split("|")[0];
            if (d < today && S.assign[k].length && !S.history[d]) days[d] = 1;
          });
          Object.keys(days).forEach(function (iso) {
            S.history[iso] = { rows: snapDay(iso).rows, saved: Date.now() };
            histSet(iso);
            n++;
          });
          var y = new Date();
          y.setDate(y.getDate() - 1);
          var lim = isoOf(y);
          Object.keys(S.assign).forEach(function (k) {
            if (k.split("|")[0] < lim) delete S.assign[k];
          });
          var ks = Object.keys(S.history).sort();
          while (ks.length > 400) delete S.history[ks.shift()];
          return n;
        }

          var first = snaps[0].iso,
            last = snaps[snaps.length - 1].iso;
          var rangeTxt =
            snaps.length === 1
              ? dayLabel(first, true)
              : dayLabel(first, true) + "  –  " + dayLabel(last, true);
          var nowT = new Date(),
            stamp =
              pad(nowT.getHours()) +
              ":" +
              pad(nowT.getMinutes()) +

              pad(nowT.getDate()) +

              pad(nowT.getMonth() + 1) +

              nowT.getFullYear();

          /* ===== Sheet 1: lưới lịch gác ===== */
          var ws = wb.addWorksheet("Lịch gác", {
            views: [{ state: "frozen", xSplit: 3, ySplit: 5 }],
            pageSetup: {
              orientation: "landscape",
              paperSize: 9,
              fitToPage: true,
              fitToWidth: 1,
              fitToHeight: 0,
              printTitlesRow: "5:5",

          });
          var keys = [],
            seen = {},
            shOrder = [];
          snaps.forEach(function (s) {
            s.byKey = {};
            s.rows.forEach(function (r) {
              var k = r.sh + "|" + r.t + "|" + r.po;

        /* Trong claude.ai dùng chức năng tải file của nền tảng; chạy độc lập thì tải thẳng bằng trình duyệt */
        function saveFile(filename, buf) {
          if (DL) return DL.save({ filename: filename, data: buf });
          return new Promise(function (res, rej) {
            try {
              var blob = new Blob([buf], {
                type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
              });
              var url = URL.createObjectURL(blob),
                a = document.createElement("a");
              a.href = url;
              a.download = filename;
              a.style.display = "none";
              document.body.appendChild(a);
              a.click();
              setTimeout(function () {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
              }, 1500);
              res();
            } catch (e) {
              rej(e);
            }
          });
        }
        function exportXlsx(mode, id) {
          var snaps, name, title;
          if (mode === "week") {
            snaps = dates.map(function (d) {
              return snapDay(d.iso);
            });
            name = "lich-gac_" + dates[0].iso + "_" + dates[6].iso;
            title = "BẢNG CẮT GÁC 7 NGÀY";
          } else if (mode === "hday") {
            var hd = S.history[id];
            if (!hd) return;
            snaps = [{ iso: id, rows: hd.rows }];
            name = "lich-gac_" + id;
            title = "BẢNG CẮT GÁC";
          } else {
            var ks = Object.keys(S.history).sort();
            if (!ks.length) {
              toast("Chưa có lịch sử");
              return;
            }
            snaps = ks.map(function (k) {
              return { iso: k, rows: S.history[k].rows };
            });
            name = "lich-su-gac_" + ks[0] + "_" + ks[ks.length - 1];
            title = "LỊCH SỬ CẮT GÁC";
          }
          var p;
          try {
            p = Promise.resolve(xlsxBuild(snaps, title));
          } catch (e) {
            toast(
              e && e.message === "no-lib"
                ? "Chưa tải được thư viện Excel, hãy tải lại trang"
                : "Không tạo được file Excel",
            );
            return;
          }
          p.then(function (buf) {
            return saveFile(name + ".xlsx", buf);
          }).then(
            function () {
              toast(DL ? "Đã lưu file Excel" : "Đang tải file Excel về máy");
            },
            function (e) {
              var c = e && e.code;
              if (c === "declined") return;
              toast(
                c === "rate_limited"
                  ? "Hãy đợi một chút rồi thử lại"
                  : "Không lưu được file Excel",
              );
            },
          );
        }

        /* ---------- Đồng bộ (Firebase) ---------- */
        /* Chỉ bật khi trang chạy độc lập và đã điền FB_CONFIG; ngoài ra dữ liệu chỉ lưu trong trình duyệt. */
        var SYNC = {
          state: "off",
          user: null,
          auth: null,
          doc: null,
          hist: null,
          dev: uid() + uid(),
          timer: null,
          first: true,
          histFirst: true,
          remoteHist: {},
          u1: null,
          u2: null,
        };
        var SKIPMODAL = false;
        function syncAvail() {
          return !!(
            window.FB_CONFIG &&
            window.FB_CONFIG.apiKey &&
            window.firebase
          );
        }
        function syncLabel() {
          return (
            {
              off: "Chưa đăng nhập",
              out: "Chưa đăng nhập",
              busy: "Đang đồng bộ…",
              ok: "Đã đồng bộ",
              err: "Lỗi đồng bộ",
            }[SYNC.state] || ""
          );
        }
        function syncBtn() {
          if (!syncAvail()) return "";
          return (
            '<button class="btn" id="syncpill" data-act="sync"><i class="dot ' +
            SYNC.state +
            '"></i><span>' +
            syncLabel() +
            "</span></button>"
          );
        }
        function syncPill() {
          var e = $("syncpill");
          if (e)
            e.innerHTML =
              '<i class="dot ' +
              SYNC.state +
              '"></i><span>' +
              syncLabel() +
              "</span>";
        }
        function rerender() {
          SKIPMODAL = true;
          try {
            render();
          } finally {
            SKIPMODAL = false;
          }
        }
        function saveLocal() {
          try {
            localStorage.setItem(LS, JSON.stringify(S));
          } catch (e) {}
        }
        function syncFail(e) {
          SYNC.state = "err";
          syncPill();
          try {
            console.warn("sync", e);
          } catch (x) {}
        }
        function syncInit() {
          if (!syncAvail()) return;
          try {
            firebase.initializeApp(window.FB_CONFIG);
            var db = firebase.firestore();
            SYNC.auth = firebase.auth();
            SYNC.doc = db.collection("gac").doc("state");
            SYNC.hist = db.collection("gacHistory");
            SYNC.state = "out";
            SYNC.auth.onAuthStateChanged(function (u) {
              SYNC.user = u || null;
              if (u) {
                SYNC.state = "busy";
                startListen();
              } else {
                stopListen();
                SYNC.state = "out";
              }
              syncPill();
            });
          } catch (e) {
            syncFail(e);
          }
        }
        function stopListen() {
          if (SYNC.u1) {
            SYNC.u1();
            SYNC.u1 = null;
          }
          if (SYNC.u2) {
            SYNC.u2();
            SYNC.u2 = null;
          }
        }
        function startListen() {
          stopListen();
          SYNC.first = true;
          SYNC.histFirst = true;
          SYNC.remoteHist = {};
          SYNC.u1 = SYNC.doc.onSnapshot(function (snap) {
            var d = snap.exists ? snap.data() : null;
            if (SYNC.first) {
              SYNC.first = false;
              if (!d || (d.updated || 0) < (S.updated || 0)) {
                S.updated = S.updated || Date.now();
                pushState();
              } else {
                applyRemote(d);
                SYNC.state = "ok";
              }
            } else if (
              d &&
              d.by !== SYNC.dev &&
              (d.updated || 0) > (S.updated || 0)
            ) {
              applyRemote(d);
              SYNC.state = "ok";
            } else if (!snap.metadata.hasPendingWrites) SYNC.state = "ok";
            syncPill();
          }, syncFail);
          SYNC.u2 = SYNC.hist.onSnapshot(function (qs) {
            var ch = false;
            qs.docChanges().forEach(function (c) {
              var iso = c.doc.id;
              if (c.type === "removed") {
                delete S.history[iso];
                delete SYNC.remoteHist[iso];
                ch = true;
              } else {
                try {
                  S.history[iso] = JSON.parse(c.doc.data().json);
                  SYNC.remoteHist[iso] = 1;
                  ch = true;
                } catch (e) {}
              }
            });
            if (SYNC.histFirst) {
              SYNC.histFirst = false;
              Object.keys(S.history).forEach(function (k) {
                if (!SYNC.remoteHist[k]) histSet(k);
              });
            }
            if (ch) {
              saveLocal();
              if (
                ui.tab === "history" ||
                (ui.modal && ui.modal.type === "hday")
              )
                rerender();
            }
          }, syncFail);
        }
        function applyRemote(d) {
          var o;
          try {
            o = JSON.parse(d.json);
          } catch (e) {
            return;
          }
          var h = S.history;
          S = o;
          S.history = h;
          normalize();
          S.updated = d.updated || 0;
          archivePast();
          saveLocal();
          ui.swap = null;
          rerender();
        }
        function pushState() {
          if (!SYNC.user || !SYNC.doc) return;
          var o = Object.assign({}, S);
          delete o.history;
          SYNC.state = "busy";
          syncPill();
          SYNC.doc
            .set({
              json: JSON.stringify(o),
              updated: S.updated || Date.now(),
              by: SYNC.dev,
            })
            .then(function () {
              SYNC.state = "ok";
              syncPill();
            }, syncFail);
        }
        function scheduleSync() {
          if (!SYNC.user) return;
          clearTimeout(SYNC.timer);
          SYNC.state = "busy";
          syncPill();
          SYNC.timer = setTimeout(pushState, 700);
        }
        function histSet(iso) {
          if (!SYNC.user || !SYNC.hist || !S.history[iso]) return;
          SYNC.hist
            .doc(iso)
            .set({ json: JSON.stringify(S.history[iso]) })
            .catch(syncFail);
        }
        function histDel(iso) {
          if (!SYNC.user || !SYNC.hist) return;

          } else {

              '<div class="field"><label for="sy-em">Email</label><input type="email" id="sy-em" autocomplete="username" autocapitalize="none" spellcheck="false"></div>' +
              '<div class="field"><label for="sy-pw">Mật khẩu</label><input type="password" id="sy-pw" autocomplete="current-password"></div>' +
              '<p class="tag bad" id="sy-err" hidden></p>' +

        function syncLogin() {
          var em = val("sy-em").trim(),
            pw = val("sy-pw"),
            er = $("sy-err"),
            go = $("sy-go");
          var say = function (t) {
            if (er) {

          }
          if (er) er.hidden = true;
          if (go) go.disabled = true;
          SYNC.auth.signInWithEmailAndPassword(em, pw).then(
            function () {
              ui.modal = null;
              renderModal();
              toast("Đã đăng nhập, đang đồng bộ");
            },
            function (e) {
              var c = (e && e.code) || "";

              say(
                c === "auth/network-request-failed"
                  ? "Không có mạng, hãy thử lại"
                  : c === "auth/too-many-requests"
                    ? "Thử quá nhiều lần, hãy đợi vài phút"

        function rosterText(list) {
          var out = [
            "BẢNG CẮT GÁC" + (S.settings.unit ? " · " + S.settings.unit : ""),
          ];
          list.forEach(function (iso) {
            out.push("", dayLabel(iso, true).toUpperCase());
            S.shifts.forEach(function (sh) {
              out.push(sh.name + " (" + sh.start + "–" + sh.end + ")");
              S.posts.forEach(function (po) {
                var names = getSlot(mk(iso, po.id, sh.id))
                  .map(function (id) {
                    var p = person(id);
                    return p ? (p.rank ? p.rank + " " : "") + p.name : "";
                  })
                  .filter(Boolean);
                var ft = slotFill(mk(iso, po.id, sh.id), po, sh.id);
                out.push(
                  "• " +
                    po.name +
                    ": " +
                    (names.length ? names.join(", ") : "(chưa có người)") +
                    (names.length && ft.mq + ft.mcs
                      ? " — thiếu " + (ft.mq + ft.mcs)
                      : ""),
                );
              });
            });
          });
          return out.join("\n");

        function doSwap(targetKey, targetPid) {
          var s = ui.swap,
            k1 = s.key,
            p1 = s.pid;
          if (targetPid) {
            if (targetKey === k1 && targetPid === p1) {
              ui.swap = null;
              render();
              return;
            }
            if (targetKey === k1) {
              toast("Hãy chọn người ở ô khác");
              return;
            }
            var a = getSlot(k1).slice(),
              b = getSlot(targetKey).slice();
            if (b.indexOf(p1) >= 0 || a.indexOf(targetPid) >= 0) {
              toast("Người này đã có trong ô kia");
              return;
            }
            a[a.indexOf(p1)] = targetPid;
            b[b.indexOf(targetPid)] = p1;
            setSlot(k1, a);
            setSlot(targetKey, b);
          } else {
            if (targetKey === k1) {
              ui.swap = null;
              render();
              return;
            }
            var po = post(targetKey.split("|")[1]),
              b2 = getSlot(targetKey).slice();
            if (b2.indexOf(p1) >= 0) {
              toast("Người này đã có trong ô đó");
              return;
            }
            if (b2.length >= po.need) {
              toast("Ô đã đủ người. Bấm vào tên một người để hoán đổi.");
              return;
            }
            var a2 = getSlot(k1).filter(function (x) {
              return x !== p1;
            });
            b2.push(p1);
            setSlot(k1, a2);
            setSlot(targetKey, b2);
          }
          ui.swap = null;
          commit("Đã đổi chỗ");
        }

        document.addEventListener("click", function (e) {
          if (e.target.classList && e.target.classList.contains("mback")) {
            closeModal();
            return;
          }
          var el = e.target.closest("[data-act]");
          if (!el || el.disabled) return;
          act(el.dataset.act, el, e);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape") {
            if (ui.modal) {
              closeModal();
            } else if (ui.swap) {
              ui.swap = null;
              render();
            }
            return;
          }
          var el = e.target;
          if (
            (e.key === "Enter" || e.key === " ") &&
            el.getAttribute &&
            /^(button|checkbox)$/.test(el.getAttribute("role") || "") &&
            el.dataset.act
          ) {
            e.preventDefault();
            act(el.dataset.act, el, e);
            return;
          }
          if (
            e.key === "Enter" &&
            el.matches &&
            el.matches(".mpanel input:not([type=checkbox]):not([type=search])")
          ) {
            var p = document.querySelector(".mpanel [data-primary]");
            if (p) {
              e.preventDefault();
              p.click();
            }
          }
        });
        document.addEventListener("input", function (e) {
          var t = e.target;
          if (t.id === "q-people") {
            ui.q = t.value;
            $("plist").innerHTML = personCards();
          } else if (
            t.id === "q-cand" &&
            ui.modal &&
            ui.modal.type === "slot"
          ) {
            $("cand").innerHTML = candHTML(ui.modal.key, t.value);
          }
        });
        document.addEventListener("change", function (e) {
          var t = e.target;
          if (!t) return;
          if (t.name === "f-type") {
            var dl = $("ranks");
            if (dl) dl.innerHTML = rankOpts(t.value);
            var hn = $("f-hint");
            if (hn) hn.innerHTML = typeHint(t.value);
            return;
          }
          if (
            t.dataset &&
            t.dataset.ex &&
            ui.modal &&
            ui.modal.type === "exchange"
          ) {
            ui.modal.ex[t.dataset.ex] = t.value;
            fixEx();
            renderModal();
            return;
          }
          if (!t.dataset || !t.dataset.set) return;
          var k = t.dataset.set;
          if (k === "unit") S.settings.unit = t.value.trim();
          else if (k === "qLimit" || k === "byOrder") S.settings[k] = t.checked;
          else if (k === "qFrom" || k === "qTo") S.settings[k] = t.value;
          else {
            var v = parseInt(t.value, 10);
            if (isNaN(v)) v = k === "minRest" ? 8 : 1;
            S.settings[k] = Math.max(
              k === "minRest" ? 0 : 1,
              Math.min(k === "minRest" ? 24 : 5, v),
            );
          }
          commit("Đã lưu quy tắc");
        });
        var dragId = null;
        function clearOver() {
          document
            .querySelectorAll(".prow.over,.prow.dragging")
            .forEach(function (x) {
              x.classList.remove("over");
              x.classList.remove("dragging");
            });
        }
        document.addEventListener("dragstart", function (e) {
          var r = e.target.closest && e.target.closest(".prow");
          if (!r) return;
          dragId = r.dataset.id;
          r.classList.add("dragging");
          try {
            e.dataTransfer.effectAllowed = "move";
            e.dataTransfer.setData("text/plain", dragId);
          } catch (x) {}
        });
        document.addEventListener("dragend", function () {
          dragId = null;
          clearOver();
        });
        document.addEventListener("dragover", function (e) {
          var r = e.target.closest && e.target.closest(".prow");
          if (!r || !dragId) return;
          var a = person(dragId),
            b = person(r.dataset.id);
          if (!a || !b || a.type !== b.type) return;
          e.preventDefault();
          document.querySelectorAll(".prow.over").forEach(function (x) {
            x.classList.remove("over");
          });
          r.classList.add("over");
        });
        document.addEventListener("drop", function (e) {
          var r = e.target.closest && e.target.closest(".prow");
          if (!r || !dragId) return;
          e.preventDefault();
          moveBefore(dragId, r.dataset.id);
          dragId = null;
          commit();
        });
        document.addEventListener("visibilitychange", function () {
          if (
            !document.hidden &&
            dates[0] &&
            dates[0].iso !== isoOf(new Date())
          )
            rollover();
        });

        buildDates();
        setInterval(function () {
          if (dates[0] && dates[0].iso !== isoOf(new Date())) rollover();
          else if (ui.modal && ui.modal.type === "now") renderModal();
        }, 30000);
        try {
          if (window.claude && claude.use)
            claude.use("downloads").then(
              function (d) {
                DL = d || null;
              },
              function () {
                DL = null;
              },
            );
        } catch (e) {}
        S = load();
        if (
          S &&
          S.settings &&
          S.settings.sample &&
          (!S.people.some(function (p) {
            return p.type;
          }) ||
            !S.posts.some(function (p) {
              return "qn" in p;
            }))
        )
          S = null;
        if (S) {
          normalize();
          prune();
          save();
        } else {
          sample();
        }
        ui.view =
          window.matchMedia && window.matchMedia("(max-width:760px)").matches
            ? "day"
            : "week";
        render();
        syncInit();
      })();
    </script>
  </body>
</html>
